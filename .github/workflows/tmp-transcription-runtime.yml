name: Temporary transcription runtime

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Environment smoke test
        run: |
          echo "GitHub Actions runner is working"
          uname -a
          mkdir -p payload
          printf 'ok\n' > payload/status.txt

      - name: Upload smoke artifact
        uses: actions/upload-artifact@v4
        with:
          name: transcription-runtime-smoke
          path: payload/status.txt
          retention-days: 1
          if-no-files-found: error
