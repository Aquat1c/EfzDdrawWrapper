name: Temporary transcription smoke

on:
  push:
    branches: [main]
    paths:
      - transcription-trigger.txt

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Write result
        run: |
          mkdir -p transcription-output
          printf 'success\n' > transcription-output/status.txt

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add transcription-output/status.txt
          git commit -m "chore: record transcription smoke result"
          git push
